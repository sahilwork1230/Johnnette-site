<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space | Johnnette Technologies</title>
    <meta name="keywords" content="unmanned aerial vehicle, johnnette jf-2, drones, fixed-wing drone, thermal camera drone, day-night camera drone, long range drone, surveillance and mapping drone, reliable and high-quality drones at low cost, drone, Defence, drone for Defence">
    <meta name="description" content="Johnnette Technologies Space company, space">
    <link rel="icon" href="img/logo/logo.webp">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=UA-248379699-1"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'UA-248379699-1');
    </script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.1.1/css/all.css">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/jf2.css">

    <!-- jQuery for header/footer loading -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(function() {
            $("#header").load("header.html");
            $("#footer").load("footer.html");
        });
    </script>

    <style>
        body {
            background-color: #0c0c0c !important;
        }

        .banner {
            position: relative;
            text-align: center;
            color: white;
        }

        .banner video {
            width: 100%;
            height: auto;
            opacity: 0.7;
        }

        .banner-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 90%;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
        }

        .card {
            background: #fff;
            color: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
            position: relative;
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .coming-soon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 10px 20px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 5px;
            width: 100%;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div id="header"></div>

    <!-- Banner with Cards -->
    <section class="banner">
        <video id="background-video" autoplay loop muted>
            <source src="img/space/videos/desktop.mp4" type="video/mp4">
        </video>
        <div class="banner-content">
            <h1>COMING SOON</h1>
            <div class="cards">
                <div class="card">
                    <img src="img/space/spaceed.jpg" alt="Space ED">
                    <div class="coming-soon">Coming Soon</div>
                    <div class="card-content">
                        <h3>Space ED</h3>
                    </div>
                </div>
                <div class="card">
                    <img src="img/space/CubeSat.webp" alt="Cube Sats">
                    <div class="coming-soon">Coming Soon</div>
                    <div class="card-content">
                        <h3>Cube Sats</h3>
                    </div>
                </div>
                <div class="card">
                    <img src="img/space/chandrayaan-3.webp" alt="Chandrayaan">
                    <div class="coming-soon">Coming Soon</div>
                    <div class="card-content">
                        <h3>Sub-System For Chandrayaan</h3>
                    </div>
                </div>
                <div class="card">
                    <img src="img/space/neemdrone.jpg" alt="Neem Drone">
                    <div class="coming-soon">Coming Soon</div>
                    <div class="card-content">
                        <h3>Neem Vacuum Drone</h3>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <div id="footer"></div>
</body>
</html>
